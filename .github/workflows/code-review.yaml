name: Code Review (reusable)
on:
  workflow_call:
    inputs:
      exclude:
        description: Comma-separated gitignore-style globs OCR must not review.
        type: string
        default: ""
      fail_on_severity:
        description: "Fail the check on a finding at or above this level: none | critical | high | medium | low."
        type: string
        default: none
      model:
        type: string
        default: gpt-6.1-sol
      llm_url:
        description: LLM endpoint. Must match `protocol`.
        type: string
        default: https://api.openai.com/v1/responses
      protocol:
        description: "openai-responses | openai. gpt-6.1-sol rejects chat completions (max_tokens)."
        type: string
        default: openai-responses
      effort:
        description: "OCR review effort: low | medium | high (empty = OCR default)."
        type: string
        default: ""
    secrets:
      CI_OPEN_AI_KEY:
        required: true
      GHCI_APP_ID:
        required: true
      GHCI_APP_PRIVATE_KEY:
        required: true

jobs:
  review:
    # Fork PRs get no secrets, so skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WORK: /tmp/review
      OCR_NO_UPDATE: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Skill + posting script come from ci-workflows at the pinned commit (public repo).
      - name: Fetch skill and post script
        env:
          RAW: https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}
        run: |
          mkdir -p "$WORK"
          curl -fsSL "$RAW/skills/code-review/SKILL.md" -o "$WORK/SKILL.md"
          curl -fsSL "$RAW/scripts/post-review.js" -o "$WORK/post-review.js"

      - name: Install OCR
        run: npm install -g --no-fund --no-audit "@alibaba-group/open-code-review@1.13.0"

      # Skill -> one OCR rule for every file, merged on top of OCR's built-in per-language rules.
      - name: Build rules
        env:
          EXCLUDE: ${{ inputs.exclude }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Drop the front matter, add the severity mapping.
          awk 'NR==1 && /^---/ {fm=1; next} fm && /^---/ {fm=0; next} !fm' "$WORK/SKILL.md" > "$WORK/rule.txt"
          printf '\n## Severity levels\n\nUse: critical, high (= major), medium, low (= minor). Give a concrete fix for every issue.\n' >> "$WORK/rule.txt"

          jq -n --rawfile rule "$WORK/rule.txt" --arg e "$EXCLUDE" '{
            exclude: ($e | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))),
            rules: [{path: "**/*", rule: $rule, merge_system_rule: true}]
          }' > "$WORK/rule.json"

          printf '# %s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$WORK/background.md"

      # The OpenAI key is only in this step's environment.
      - name: Run OCR
        env:
          OCR_LLM_TOKEN: ${{ secrets.CI_OPEN_AI_KEY }}
          LLM_URL: ${{ inputs.llm_url }}
          LLM_MODEL: ${{ inputs.model }}
          PROTOCOL: ${{ inputs.protocol }}
          EFFORT: ${{ inputs.effort }}
        run: |
          ocr config set llm.url "$LLM_URL"
          ocr config set llm.model "$LLM_MODEL"
          ocr config set llm.protocol "$PROTOCOL"
          ocr config set llm.auth_token_cmd 'printf "%s" "$OCR_LLM_TOKEN"'

          args=(--from "$BASE_SHA" --to "$HEAD_SHA" --audience agent --format json
                --rule "$WORK/rule.json" --background-file "$WORK/background.md")
          [ -n "$EFFORT" ] && args+=(--effort "$EFFORT")

          code=0
          ocr review "${args[@]}" > "$WORK/result.json" 2> "$WORK/stderr.log" || code=$?

          echo "::group::OCR result";  cat "$WORK/result.json";  echo "::endgroup::"
          echo "::group::OCR stderr";  cat "$WORK/stderr.log";   echo "::endgroup::"
          exit "$code"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GHCI_APP_ID }}
          private-key: ${{ secrets.GHCI_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_FILE: ${{ env.WORK }}/result.json
          FAIL_ON: ${{ inputs.fail_on_severity }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await require(process.env.WORK + '/post-review.js')({ github, context, core });
